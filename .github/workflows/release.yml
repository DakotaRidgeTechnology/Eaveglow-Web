name: Release

# Push a tag like v1.0.0 to build, test and publish a GitHub release with the
# two files to upload to a controller. Notes come from docs/release-notes.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/eaveglow.htm.gz dist/eaveglow-icon.png \
            --title "Eaveglow ${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md
