name: Release

# Builds, tests and publishes a GitHub release with the two files to upload
# to a controller. Either push a tag like v1.0.0, or run it from the Actions
# tab with the version (it creates the tag). Notes: docs/release-notes.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/eaveglow.htm.gz dist/eaveglow-icon.png \
            --target "$GITHUB_SHA" --title "Eaveglow ${TAG#v}" --notes-file docs/release-notes.md
